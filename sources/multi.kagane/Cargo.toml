[package]
name = "kagane"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
aidoku = { git = "https://github.com/Aidoku/aidoku-rs.git", rev = "ae6485e3c14ecd1fd5497d170eae884c68d04a87", package = "aidoku", features = ["json"], version = "0.3.0" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
aidoku = { git = "https://github.com/Aidoku/aidoku-rs.git", rev = "ae6485e3c14ecd1fd5497d170eae884c68d04a87", features = ["test"] }
aidoku-test = { git = "https://github.com/Aidoku/aidoku-rs.git", rev = "ae6485e3c14ecd1fd5497d170eae884c68d04a87" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
lto = true

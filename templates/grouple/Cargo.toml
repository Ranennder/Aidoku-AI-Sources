[package]
name = "grouple"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aidoku = { git = "https://github.com/Aidoku/aidoku-rs.git", rev = "ae6485e3c14ecd1fd5497d170eae884c68d04a87", features = ["json"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
aidoku = { git = "https://github.com/Aidoku/aidoku-rs.git", rev = "ae6485e3c14ecd1fd5497d170eae884c68d04a87", features = ["test", "json"] }
aidoku-test = { git = "https://github.com/Aidoku/aidoku-rs.git", rev = "ae6485e3c14ecd1fd5497d170eae884c68d04a87" }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
